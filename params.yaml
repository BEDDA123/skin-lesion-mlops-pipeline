# Chemins et hyperparamètres centralisés (modifiables sans toucher au code)
data:
  # Définir SKIN_CSV_PATH pour surcharger (recommandé sous Windows)
  raw_csv: data/raw/hmnist_3classes.csv
  processed_dir: data/processed
  random_seed: 42
  test_size: 0.15
  val_size: 0.15  # fraction du jeu restant après le test (stratifié)

preprocess:
  normalize_max: 255.0
  normalization_method: standard  # standard, minmax, robust
  imbalance_method: none  # none, smote, smote_tomek, undersample
  smote_strategy: auto  # auto ou dict {0: 1500, 1: 3000, 2: 1500}
  
pca:
  enabled: false
  variance_threshold: 0.95  # Conserver 95% de la variance
  max_components: 500  # Maximum 500 components

# Class imbalance handling (balanced weights with moderate boost for minority classes)
imbalance:
  strategy: "balanced_minority"  # balanced_minority (moderate boost for rare classes)
  rare_class_boost: 1.2  # reduced boost to prevent overfitting
  rare_classes: [1, 2]  # classes 1 and 2 are minority (after remapping from 2,4,6 to 0,1,2)
  
# Calibration probabiliste (DISABLED - removed to prevent data leakage)
calibration:
  enabled: false
  method: "sigmoid"  # sigmoid | isotonic
  
# Optimisation des seuils
thresholding:
  enabled: false  # À activer après diagnostic
  target_metric: "f1_macro"  # f1_macro | recall_macro
  min_confidence: 0.5  # seuil minimal de confiance

train:
  sample_rows: null  # ex: 2000 pour un run rapide; null = tout le dataset
  logistic:
    max_iter: 1000  # réduit de 5000 à 1000
    C: 0.5  # régularisation plus forte pour réduire l'overfitting
    class_weight: "balanced_plus"  # activé dans le code
  rf:
    n_estimators: 300  # augmenté de 200 à 300
    max_depth: 10  # reduced from 15 to 10 to reduce overfitting
    min_samples_leaf: 4  # increased from 2 to 4 to reduce overfitting
    min_samples_split: 5
    class_weight: "balanced_subsample"
  xgb:
    n_estimators: 400  # augmenté de 300 à 400
    max_depth: 6  # réduit de 8 à 6 pour réduire l'overfitting
    learning_rate: 0.02  # réduit de 0.05 à 0.02 pour apprentissage plus lent/stable
    subsample: 0.7  # réduit de 0.8 à 0.7
    colsample_bytree: 0.7  # réduit de 0.8 à 0.7
    reg_alpha: 0.5  # increased from 0.1 to 0.5 for stronger L1 regularization
    reg_lambda: 2.0  # increased from 1.0 to 2.0 for stronger L2 regularization
    scale_pos_weight: 1.0  # géré via sample_weight

mlflow:
  experiment_name: skin_lesion_3class
  tracking_uri: file:./mlruns
  enable_model_registry: false  # Set to true to enable automatic model registration
  model_registry_name: skin_lesion_classifier  # Name for registered model in MLflow Model Registry

api:
  host: 0.0.0.0
  port: 8000

monitoring:
  log_dir: reports/logs
  reference_sample_size: 2000
