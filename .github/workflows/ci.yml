name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate tiny dataset
        run: python scripts/generate_tiny_dataset.py --out data/raw/hmnist_filtered.csv --rows 300

      - name: Lint (ruff)
        run: ruff check src scripts tests

      - name: Train pipeline (fast, prépare les artefacts pour les tests)
        env:
          FAST_TRAIN: "1"
          SKIN_CSV_PATH: data/raw/hmnist_filtered.csv
        run: python -m src.train --force-prepare

      - name: Tests
        env:
          FAST_TRAIN: "1"
          SKIN_CSV_PATH: data/raw/hmnist_filtered.csv
        run: pytest -q
